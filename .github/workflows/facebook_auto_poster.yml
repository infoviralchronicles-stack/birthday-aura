name: Facebook Daily Birthday Auto-Poster

on:
  schedule:
    # Runs daily at 04:00 UTC (09:00 AM Pakistan Standard Time)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Facebook Auto-Poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python scripts/facebook_auto_post.py
